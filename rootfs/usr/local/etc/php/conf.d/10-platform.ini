; exciting IT platform defaults on top of php.ini-production. ${VAR} values come from the container
; environment (defaults in the Dockerfile, per site in Dokploy). A site can still add its own
; zz-*.ini, which loads later and wins.

; --- limits (per site) ---
memory_limit = ${PHP_MEMORY_LIMIT}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_time = ${PHP_MAX_INPUT_TIME}
max_input_vars = ${PHP_MAX_INPUT_VARS}
date.timezone = ${PHP_TIMEZONE}

; --- reveal nothing to visitors ---
; no "X-Powered-By: PHP/8.3.x" header
expose_php = Off
; errors go to the container log, never into the page
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
; stack traces in logs without function arguments (could hold passwords)
zend.exception_ignore_args = On

; --- limit what injected code can do ---
; no shell commands (default list in the Dockerfile; empty for sites that need them)
disable_functions = ${PHP_DISABLE_FUNCTIONS}
; include()/require() of URLs is never legitimate. allow_url_fopen stays on: plugins fetch feeds/APIs.
allow_url_include = Off

; --- sessions ---
session.cookie_httponly = On
session.cookie_secure = ${PHP_SESSION_COOKIE_SECURE}
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off
; no session.cookie_samesite: "Lax" would drop the session when a payment provider POSTs the
; customer back to the shop (PayPal, Klarna), i.e. lost orders. Apps that want it set it themselves.

; --- performance ---
opcache.enable = 1
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
