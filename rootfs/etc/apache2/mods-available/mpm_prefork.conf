# prefork MPM, sized from the environment (set per site/plan, see README "Resources").
# Every worker is one PHP process: APACHE_MAX_WORKERS is the number of requests served at the
# same time; further requests wait in the listen queue. site-entrypoint keeps the other values
# consistent with it.
<IfModule mpm_prefork_module>
	StartServers            ${APACHE_START_SERVERS}
	MinSpareServers         ${APACHE_MIN_SPARE}
	MaxSpareServers         ${APACHE_MAX_SPARE}
	ServerLimit             ${APACHE_MAX_WORKERS}
	MaxRequestWorkers       ${APACHE_MAX_WORKERS}
	MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
